name: Quality Gates

on:
  push:
    branches:
      - main
      - chore/engineering-quality-gates
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendor anti-slop
        run: npm run vendor:anti-slop

      - name: Bootstrap lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/engineering-quality-gates'
        run: |
          if test -f package-lock.json; then
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile"
          git push

      - name: Verify lockfile
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
